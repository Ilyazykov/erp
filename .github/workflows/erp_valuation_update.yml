name: Update ERP valuation charts

on:
  schedule:
    - cron: "20 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r erp_valuation/requirements.txt

      - name: Update source data (prices, OFZ, earnings)
        run: python erp_valuation/update_data.py

      - name: Recalculate composite valuation and charts
        run: python erp_valuation/composite_valuation.py

      - name: Recalculate per-stock yield (erp_portfolio.csv)
        run: python erp_valuation/erp_full.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ erp_valuation/charts/ erp_valuation/erp_portfolio.xlsx
          git commit -m "chore: update ERP valuation data and charts" || echo "No changes to commit"
          git push || echo "No changes to push"
