name: Update USD/RUB history

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r usd_rub_tracker/requirements.txt

      - name: Update USD/RUB history CSV
        run: python usd_rub_tracker/scripts/update_usd_rub.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usd_rub_history.csv data/usd_rub_history_5y.csv data/usd_rub_stats.json
          git commit -m "chore: update USD/RUB history" || echo "No changes to commit"
          git push || echo "No changes to push"
