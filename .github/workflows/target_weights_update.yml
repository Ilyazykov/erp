name: Update target portfolio weights

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch CBR key rate
        run: python erp_valuation/fetch_key_rate.py

      - name: Calculate target weights and allocation
        run: python erp_valuation/calc_target_weights.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/target_weights.json data/target_weights.csv data/target_allocation.json data/target_allocation.csv data/key_rate.csv
          git commit -m "chore: update target portfolio weights and allocation" || echo "No changes to commit"
          git push || echo "No changes to push"
