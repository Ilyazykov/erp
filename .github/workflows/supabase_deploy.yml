name: Deploy Supabase (migrations + Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase_deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: |
          ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$SUPABASE_DB_PASSWORD")
          supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-eu-west-1.pooler.supabase.com:6543/postgres"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy update-market-prices --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy sync-crypto-wallets --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy import-bybit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy import-crypto-com --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy import-telegram-wallet --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy import-binance --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy update-real-estate-index --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy update-fund-holdings --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
