name: Deploy Supabase (migrations + Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: |
          ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$SUPABASE_DB_PASSWORD")
          supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-eu-west-1.pooler.supabase.com:6543/postgres"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy import-trades-csv --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy import-revolut-statement --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy import-revolut-fund-statement --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy import-revolut-deposit-statement --project-ref "$SUPABASE_PROJECT_REF"
          # --no-verify-jwt: this function is invoked by pg_cron (see
          # supabase/migrations/20250101000005_schedule_market_prices.sql),
          # which has no end-user session/JWT to present. The function
          # itself only ever uses its own service-role credentials to read
          # trades/write market_prices, regardless of caller, so this does
          # not loosen who can write price data -- it only lets the
          # platform-level request through so cron can reach it at all.
          supabase functions deploy update-market-prices --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
