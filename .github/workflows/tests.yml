name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Charts tab target checks
        run: node tests/charts.test.mjs
