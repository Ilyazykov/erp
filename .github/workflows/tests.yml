name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # every tests/*.test.mjs: none needs an npm install (tests/page_snapshot/
      # does -- and Chrome -- and is run by hand around a refactoring)
      - name: Unit tests
        run: for t in tests/*.test.mjs; do echo "== $t"; node "$t" || exit 1; done
